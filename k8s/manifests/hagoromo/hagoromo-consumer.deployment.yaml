apiVersion: apps/v1
kind: Deployment
metadata:
  name: hagoromo-consumer-deployment
  labels:
    app: hagoromo-consumer
spec:
  replicas: 1 # number of replicas to run
  selector:
    matchLabels:
      app: hagoromo-consumer
  template:
    metadata:
      labels:
        app: hagoromo-consumer
    spec:
      initContainers:
        - name: hagoromo-db-check
          image: mongo:5
          command: ['/bin/bash', '-c', 
            "until mongo 
              --host $MONGO_HOST 
              --port $MONGO_PORT 
              --eval 
              'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' --quiet; 
            do 
              echo 'Waiting for MongoDB'; 
              sleep 2; 
            done;
            echo 'MongoDB is ready!';"
          ]

          envFrom:
            - configMapRef:
                name: hagoromo-config
      containers:
        - name: hagoromo-consumer
          image: hagoromo/python
          args: ["consumer"]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: hagoromo-config
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hagoromo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
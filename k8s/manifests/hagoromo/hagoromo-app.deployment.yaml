apiVersion: apps/v1
kind: Deployment
metadata:
  name: hagoromo-app-deployment
  labels:
    app: hagoromo
spec:
  replicas: 1 # number of replicas to run
  selector:
    matchLabels:
      app: hagoromo
  template:
    metadata:
      labels:
        app: hagoromo
    spec:
      initContainers:
        - name: hagoromo-db-check
          image: mongo:5
          command: ['/bin/bash', '-c', 
            "until mongo 
              --host $MONGO_HOST 
              --port $MONGO_PORT 
              --eval 
              'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' --quiet; 
            do 
              echo 'Waiting for MongoDB'; 
              sleep 2; 
            done;
            echo 'MongoDB is ready!';"
          ]

          envFrom:
            - configMapRef:
                name: hagoromo-config
      containers:
        - name: hagoromo
          image: hagoromo/python
          args: ["app"]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 8010 # port exposed by the container
          envFrom:
            - configMapRef:
                name: hagoromo-config
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hagoromo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: hagoromo-secret
                  key: JWT_KEY
          # livenessProbe:
          #   httpGet:
          #     path: /health/live/
          #     port: 8010
          #   initialDelaySeconds: 5
          #   timeoutSeconds: 3
          #   periodSeconds: 30
          # readinessProbe:
          #   httpGet:
          #     path: /health/ready/
          #     port: 8010
          #   initialDelaySeconds: 5
          #   timeoutSeconds: 5
          #   periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hagoromo-service
spec:
  selector:
    app: hagoromo
  ports:
    - name: http
      protocol: TCP
      port: 8010 # port exposed by the service
      targetPort: 8010 # port exposed by the container
  type: ClusterIP # type of the service

